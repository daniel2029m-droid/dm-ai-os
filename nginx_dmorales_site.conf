# Nginx VirtualHost Configuration for VPS (62.171.169.50)
# Subdomains dedicated for DM AI OS: app.dmorales.site & ai.dmorales.site
# Preserves main domain (dmorales.site / mysticia) intact

server {
    listen 80;
    listen [::]:80;
    server_name app.dmorales.site ai.dmorales.site;

    # Redirect HTTP to HTTPS
    return 301 https://app.dmorales.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.dmorales.site;

    ssl_certificate /etc/letsencrypt/live/app.dmorales.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dmorales.site/privkey.pem;

    return 301 https://app.dmorales.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.dmorales.site;

    ssl_certificate /etc/letsencrypt/live/app.dmorales.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dmorales.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
