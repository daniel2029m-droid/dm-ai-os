[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operating-system"
version = "1.0.0"
description = "A provider-agnostic, plugin-driven, DAG-based multi-agent AI Operating System for local intelligence and workflow automation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI OS Team", email = "dev@ai-os.local"}
]
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0"
]

[project.scripts]
ai-os = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
